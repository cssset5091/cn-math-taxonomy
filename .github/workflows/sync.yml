name: Sync from upstream

on:
  schedule:
    # 北京时间每周二凌晨 4:00（UTC 周一 20:00）
    - cron: '0 20 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Sync upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/xiaoyang111222/cn-math-taxonomy.git || true
          git fetch upstream
          git merge --no-edit upstream/main
          git push origin main
